<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RomeoPro Tracker — марафон $10k → $10M</title>
    <meta name="description" content="Трекер покерного марафона RomeoPro. From Hero to Zero — с $10,000 до $10,000,000." />
    <link rel="icon" href="/favicon.svg" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #030b18;
        color: #e2e8f0;
        font-family: system-ui, sans-serif;
        min-height: 100vh;
      }
      #splash {
        position: fixed;
        inset: 0;
        background: #030b18;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        z-index: 9999;
        transition: opacity 0.4s;
      }
      #splash .logo { font-size: 48px; }
      #splash .title { font-size: 22px; font-weight: 700; color: #22c55e; letter-spacing: 0.05em; }
      #splash .sub { font-size: 14px; color: #334155; }
      #splash .bar-wrap { width: 200px; height: 3px; background: #0f1f2e; border-radius: 2px; overflow: hidden; }
      #splash .bar { height: 100%; width: 30%; background: linear-gradient(90deg, #15803d, #4ade80); border-radius: 2px; animation: load 1.2s ease-in-out infinite alternate; }
      @keyframes load { to { width: 90%; } }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="logo">🎲</div>
      <div class="title">RomeoPro Tracker</div>
      <div class="sub">Загружаем данные марафона…</div>
      <div class="bar-wrap"><div class="bar"></div></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Hide splash after React mounts
      document.addEventListener('DOMContentLoaded', () => {
        const obs = new MutationObserver(() => {
          if (document.getElementById('root').children.length > 0) {
            const s = document.getElementById('splash');
            if (s) { s.style.opacity = '0'; setTimeout(() => s.remove(), 400); }
            obs.disconnect();
          }
        });
        obs.observe(document.getElementById('root'), { childList: true });
      });
    </script>
  </body>
</html>
