name: Update Leaderboards

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leaderboards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  leaderboards:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch GGWF leaderboards
        run: npm run leaderboards:ggwf -- --write data/leaderboards.json

      - name: Publish changed leaderboard snapshot
        shell: bash
        run: |
          git config user.name "RomeoPro Scraper"
          git config user.email "scraper@romeoprotracker.vercel.app"
          git pull --rebase origin main || true
          git add data/leaderboards.json
          if git diff --cached --quiet; then
            echo "No leaderboard changes"
            exit 0
          fi
          git commit -m "scraper: update GGWF leaderboards"
          git push
