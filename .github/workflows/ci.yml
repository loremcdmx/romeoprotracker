name: CI

on:
  push:
    paths-ignore:
      - 'data/**'
      - 'public/data/**'
  pull_request:
    paths-ignore:
      - 'data/**'
      - 'public/data/**'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build and tests
        run: npm run check
