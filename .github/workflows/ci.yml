name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths-ignore:
      - 'data/**'
      - 'public/data/**'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'CLAUDE.md'
      - 'IDEAS.md'
  pull_request:
    paths-ignore:
      - 'data/**'
      - 'public/data/**'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'CLAUDE.md'
      - 'IDEAS.md'
  # Data commits (data/**) never start the runs above, so a test that reads the live
  # archive can go red unnoticed. Once a day the same job runs on main (the default
  # branch, which is what a schedule always checks out), and on demand.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build and tests
        run: npm run check
