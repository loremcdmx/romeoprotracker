name: Scrape Forum

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Scrape mode
        required: false
        default: normal
        type: choice
        options:
          - normal
          - full
          - reextract
          - translate

permissions:
  contents: write

concurrency:
  group: scrape-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # The job talks to third-party hosts with secrets in env; take the
          # newest 22.x from the node-versions manifest instead of the possibly
          # stale runner toolcache (security releases).
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Resolve scrape mode
        shell: bash
        run: |
          mode="${{ inputs.mode || 'normal' }}"
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "0 */12 * * *" ]]; then
            mode="full"
          fi
          echo "SCRAPE_MODE=$mode" >> "$GITHUB_ENV"

      - name: Run scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional failure alert (scripts/scrape.mjs notifyFailure). An unset
          # secret arrives as an empty string, which the scraper treats as
          # "not configured", so nothing breaks until these are filled in.
          SCRAPE_ALERT_WEBHOOK: ${{ secrets.SCRAPE_ALERT_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Europe/Warsaw
        run: node scripts/scrape.mjs
