name: Scrape Forum

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 min — new posts + recent likes (fast with early exit)
    - cron: '0 */6 * * *'    # every 6 hours — full scan, all likes
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scrape mode'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - full
          - reextract

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock cheerio

      - name: Run scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCRAPE_MODE: ${{ github.event.schedule == '0 */6 * * *' && 'full' || inputs.mode || 'normal' }}
        run: node scripts/scrape.mjs
